name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Task book section 1.1/1.4 (2026-08-21): reference production Python = 3.14.
# Matrix:
#   Windows + 3.14    REQUIRED (only supported/reference application runtime)
#   Linux   + 3.14    REQUIRED (CI-only cross-platform manifest/file_uri drift check)
# CI never installs the AmazingData SDK and holds no real provider credentials.

jobs:
  quality:
    name: Lint & Type Check (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.14"
            required: true
          - os: ubuntu-latest
            python-version: "3.14"
            required: true
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (no AmazingData SDK)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest (unit + integration incl. migration-from-zero, identity rebuild, secret leak)
        run: uv run pytest

      - name: Verify AmazingData SDK is absent in CI env
        shell: bash
        run: |
          if uv run python -c "import AmazingData" 2>/dev/null; then
            echo "::error::AmazingData SDK must not be installed in CI"
            exit 1
          fi
          echo "OK: AmazingData SDK not present in CI environment"
