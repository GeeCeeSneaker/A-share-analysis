[project]
name = "ashare-state"
version = "0.1.0"
description = "A-share market state data foundation (daily module), Phase 0 engineering skeleton"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # Core data stack (versions locked in uv.lock -> environment_lock_hash)
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "polars>=1.9.0",
    "typer>=0.12.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    # Windows has no system tz database; required for Asia/Shanghai awareness
    "tzdata>=2024.2",
    # DuckDB python client requires pytz to fetch TIMESTAMPTZ values
    "pytz>=2024.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "types-PyYAML>=6.0.12",
]
# NOTE: AmazingData SDK is a broker-distributed local wheel.
# Per ADR/design ruling it is NOT declared here (no machine absolute paths in uv.lock).
# Install manually on the controlled dev machine and record
# package/version/install method/hash in docs/provider_verification/amazingdata.md.
# Adapters must lazy-import it; core package & CI must never require it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ashare = "ashare_state.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_state"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "docs",       # frozen design docs contain illustrative code blocks - never touched
    ".codebuddy", # IDE-managed data, not project source
    "data",       # local data area (gitignored)
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib (prefer pathlib over os.path)
]
ignore = [
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"src/ashare_state/cli.py" = ["B008"] # typer.Option in defaults is the framework idiom
"scripts/spike/*" = ["T201"] # spike scripts may print (no logger requirement yet)
"tests/*" = ["A002", "N801", "N802", "N803", "B017"] # pytest conventions; B017: failure injection needs broad raises

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ashare_state"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests touching real filesystem/duckdb (slower)",
    "golden: golden dataset comparisons",
]
